name: Build N60 Pro (ImmortalWrt 24.10.6 + mt76 fix)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      private_settings:
        description: 'Embed ROUTER_CONFIG and encrypt the download (true = private firmware)'
        type: boolean
        default: true
        required: true
      note:
        description: 'Optional build note'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: n60-pro-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'push' || github.event.head_commit.message == 'ci-trigger-cached-n60-pro-run-once' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CCACHE_DIR: ${{ github.workspace }}/firmware/.ccache
      CCACHE_MAXSIZE: 1500M
    steps:
      - name: Checkout overlay repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test settings utilities without real credentials
        run: python3 -m unittest discover -s tests -v

      - name: Validate private config before expensive build
        if: ${{ github.event_name == 'push' || inputs.private_settings }}
        env:
          ROUTER_CONFIG: ${{ secrets.ROUTER_CONFIG }}
        run: |
          set -euo pipefail
          python3 scripts/render_router_config.py
          sh -n files/etc/uci-defaults/99-router-config

      - name: Reclaim disk space for cross-compilation
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache \
            /usr/local/share/powershell /usr/local/.ghcup /opt/az /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - name: Install ImmortalWrt build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang llvm flex bison gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev libgmp-dev \
            libmpc-dev libmpfr-dev libreadline-dev cmake gperf help2man \
            patch pkgconf python3 python3-ply python3-pyelftools \
            rsync unzip zlib1g-dev file curl wget xz-utils zstd \
            subversion swig cpio squashfs-tools device-tree-compiler \
            p7zip-full ninja-build qemu-utils
          df -h /

      - name: Checkout pinned ImmortalWrt source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: 5fa11a1b5689154d296fdacf1e16a7abccb897b9
          path: firmware
          persist-credentials: false
          fetch-depth: 1

      # Cache only public downloaded sources and compiler objects. Never cache
      # firmware/files, ROUTER_CONFIG, decrypted images or full build directories.
      - name: Create cache directories
        run: mkdir -p firmware/dl firmware/.ccache

      - name: Restore downloaded package sources
        id: dl-cache
        uses: actions/cache/restore@v4
        with:
          path: firmware/dl
          key: n60-dl-ubuntu24-v1-${{ hashFiles('firmware/feeds.conf.default', 'configs/n60-pro.config', 'packages/**/Makefile') }}
          restore-keys: |
            n60-dl-ubuntu24-v1-

      - name: Restore ccache compiler outputs
        id: ccache-cache
        uses: actions/cache/restore@v4
        with:
          path: firmware/.ccache
          key: n60-ccache-ubuntu24-v1-${{ hashFiles('firmware/feeds.conf.default', 'configs/n60-pro.config', 'patches/mt76/*.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            n60-ccache-ubuntu24-v1-${{ hashFiles('firmware/feeds.conf.default', 'configs/n60-pro.config', 'patches/mt76/*.patch') }}-

      - name: Validate mt76 fix and overlay custom packages
        run: |
          set -euo pipefail
          bash scripts/prepare_source.sh firmware
          mkdir -p firmware/files
          cp -a files/. firmware/files/

      - name: Install pinned package feeds
        working-directory: firmware
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate N60 Pro build configuration
        run: |
          set -euo pipefail
          cp configs/n60-pro.config firmware/.config
          make -C firmware defconfig
          grep -Fxq 'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y' firmware/.config
          grep -Fxq 'CONFIG_PACKAGE_luci=y' firmware/.config
          grep -Fxq 'CONFIG_CCACHE=y' firmware/.config
          echo 'Configuration verified: Netcore N60 Pro, LuCI, and ccache.'

      - name: Download sources
        working-directory: firmware
        run: |
          set -euo pipefail
          make download -j4
          df -h /

      - name: Save downloaded sources after successful download
        if: ${{ steps.dl-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: firmware/dl
          key: ${{ steps.dl-cache.outputs.cache-primary-key }}

      - name: Compile image (retry one job for full failure diagnostics)
        id: compile
        working-directory: firmware
        run: |
          set -euo pipefail
          make -j4 || make -j1 V=s

      # Even when the firmware build fails, its completed object files can
      # speed up the next diagnostic run. The .ccache folder has no credentials.
      - name: Show compiler cache statistics
        if: ${{ !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        run: |
          if [ -x firmware/staging_dir/host/bin/ccache ]; then
            firmware/staging_dir/host/bin/ccache -s || true
          fi

      - name: Save ccache after compilation attempt
        if: ${{ !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: firmware/.ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      - name: Stage N60 Pro sysupgrade image and checksums
        run: |
          set -euo pipefail
          mkdir -p dist/payload
          mapfile -t images < <(find firmware/bin/targets/mediatek/filogic \
            -maxdepth 1 -type f -name '*netcore_n60-pro*sysupgrade.itb' -print)
          if (( ${#images[@]} != 1 )); then
            echo "Expected exactly one N60 Pro sysupgrade image, got ${#images[@]}" >&2
            exit 1
          fi
          test -s "${images[0]}"
          cp "${images[0]}" dist/payload/
          (cd dist/payload && sha256sum *.itb > SHA256SUMS)
          echo 'Firmware image and checksum prepared (not published yet).'

      - name: Encrypt private image with router root password
        if: ${{ github.event_name == 'push' || inputs.private_settings }}
        env:
          ROUTER_CONFIG: ${{ secrets.ROUTER_CONFIG }}
        run: |
          set -euo pipefail
          archive_password="$(python3 scripts/archive_password.py)"
          echo "::add-mask::${archive_password}"
          7z a -t7z -mhe=on -mx=5 "-p${archive_password}" \
            dist/n60-pro-private.7z ./dist/payload/* >/dev/null
          7z t "-p${archive_password}" dist/n60-pro-private.7z >/dev/null
          unset archive_password
          test -s dist/n60-pro-private.7z
          echo 'Encrypted archive verified; use the router root password to extract it.'

      - name: Upload encrypted private firmware (ciphertext only)
        if: ${{ github.event_name == 'push' || inputs.private_settings }}
        uses: actions/upload-artifact@v4
        with:
          name: n60-pro-private-encrypted
          path: dist/n60-pro-private.7z
          if-no-files-found: error
          retention-days: 7

      - name: Upload generic firmware (no private credentials)
        if: ${{ github.event_name != 'push' && !inputs.private_settings }}
        uses: actions/upload-artifact@v4
        with:
          name: n60-pro-generic-sysupgrade
          path: dist/payload/*
          if-no-files-found: error
          retention-days: 7

      - name: Disk usage diagnostics
        if: always()
        run: |
          df -h /
          du -sh firmware 2>/dev/null || true
